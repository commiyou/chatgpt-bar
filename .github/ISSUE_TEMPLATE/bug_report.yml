name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove account data, cookies, tokens, and private conversation content before submitting.
  - type: input
    id: version
    attributes:
      label: ChatGPT Bar version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 15.7.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Do not include private conversation content.
