name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run automated test suite
        run: sh scripts/test-all.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ChatGPTBar-macos-app
          path: dist/ChatGPT Bar.app
          retention-days: 3
